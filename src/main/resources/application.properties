server.port=${SERVER_PORT:8080}

spring.application.name=planillas-backend

# Credenciales siempre por variables de entorno. Nunca commitear valores reales.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_planillapro}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: minimo 32 bytes. Generar con: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
